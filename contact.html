<main id="main">
<section class="section contact">
<div>
<h1 class="title" style="font-size:clamp(44px,6vw,72px);letter-spacing:.12em">Say hello</h1>
<p>Bookings, press and collaborations.</p>
<a href="mailto:hello@silverparable.ca">hello@silverparable.ca</a>
</div>
<div>
<div class="tabs" role="tablist" aria-label="Contact type">
<button class="tab" role="tab" id="tab-general" aria-selected="true" aria-controls="panel-general" type="button">General Contact</button>
<button class="tab" role="tab" id="tab-business" aria-selected="false" aria-controls="panel-business" tabindex="-1" type="button">Business &amp; Licensing</button>
</div>
<div class="panel" role="tabpanel" id="panel-general" aria-labelledby="tab-general">
<form data-form="contact" data-success="Message sent. Thank you, we will reply by email." action="https://formspree.io/f/xgaoyydz" method="POST">
<input type="hidden" name="_subject" value="SILVER PARABLE: new general contact message">
<label class="hp" aria-hidden="true">Leave empty<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
<label class="field"><span>Name</span><input type="text" name="name" required maxlength="120" autocomplete="name"></label>
<label class="field"><span>Email</span><input type="email" name="email" required maxlength="200" autocomplete="email"></label>
<label class="field"><span>Message</span><textarea name="message" rows="5" required maxlength="5000"></textarea></label>
<button class="btn" type="submit">Send message</button>
</form>
<p class="status" role="status" aria-live="polite"></p>
</div>
<div class="panel" role="tabpanel" id="panel-business" aria-labelledby="tab-business" hidden>
<form data-form="business" data-success="Inquiry sent. Thank you, we will respond by email." action="https://formspree.io/f/xaeqjjkw" method="POST">
<input type="hidden" name="_subject" value="SILVER PARABLE: new business &amp; licensing inquiry">
<label class="hp" aria-hidden="true">Leave empty<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
<label class="field"><span>Full name</span><input type="text" name="name" required maxlength="120" autocomplete="name"></label>
<label class="field"><span>Email address</span><input type="email" name="email" required maxlength="200" autocomplete="email"></label>
<label class="field"><span>Company / organization <em>optional</em></span><input type="text" name="company" maxlength="160" autocomplete="organization"></label>
<label class="field"><span>Inquiry type</span><select name="inquiry_type" required>
<option value="" selected disabled>Select a type</option>
<option>Music Licensing</option><option>Booking</option><option>Collaboration</option><option>Media/Press</option><option>Partnerships</option><option>Other</option>
</select></label>
<label class="field"><span>Message</span><textarea name="message" rows="5" required maxlength="5000"></textarea></label>
<button class="btn" type="submit">Send inquiry</button>
</form>
<p class="status" role="status" aria-live="polite"></p>
</div>
</div>
